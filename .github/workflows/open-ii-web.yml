name: Open Immune Intelligence Web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run audit:open-ii
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          OPEN_II_SESSION_SECRET: ci-only-open-immune-session-secret-000000000000000000000000
          OPEN_II_APP_ORIGIN: http://localhost:3000
